<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE" />
      <stop offset="100%" stop-color="#229ED9" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 19px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #f8fafc; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #94a3b8; }
    .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; fill: #38bdf8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg)" />
  <rect width="1200" height="420" rx="16" fill="url(#glowPurple)" />
  <rect width="1200" height="420" rx="16" fill="url(#glowBlue)" />
  <rect width="1200" height="420" rx="16" fill="url(#glowCyan)" />

  <!-- Subtle Border Grid / Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- LEFT: Hero Content -->
  <g transform="translate(60, 65)">
    <!-- Top Tag -->
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text x="30" y="20" class="badge-text" fill="#38bdf8">REMOTE AI CONTROLLER</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">
      Antigravity <tspan fill="url(#accentGrad)">Bridge</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle">
      Control, prompt, and monitor your local Google Antigravity
    </text>
    <text x="0" y="150" class="subtitle">
      AI coding agent directly from Telegram on your phone.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1: Win32 Native -->
      <rect x="0" y="0" width="145" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="23" class="badge-text">⚡ Zero CDP Setup</text>

      <!-- Pill 2: Screenshots -->
      <rect x="155" y="0" width="155" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="169" y="23" class="badge-text">📸 Live Screenshots</text>

      <!-- Pill 3: Battery & Health -->
      <rect x="320" y="0" width="165" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="334" y="23" class="badge-text">🔋 Battery &amp; Health</text>
    </g>

    <!-- Quick Terminal Hint -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="485" height="42" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="15" y="26" class="mono">&gt; run.bat &amp;&amp; telegram /start</text>
      <text x="360" y="26" class="mono" fill="#10b981">● READY</text>
    </g>
  </g>

  <!-- RIGHT: Visual Interaction Diagram (Phone & Laptop) -->
  <g transform="translate(680, 50)">
    <!-- Telegram Mockup Card (Phone) -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="200" height="230" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
      
      <!-- Phone Header -->
      <rect x="0" y="0" width="200" height="42" rx="18" fill="#0284c7" />
      <rect x="0" y="24" width="200" height="18" fill="#0284c7" />
      <circle cx="22" cy="21" r="12" fill="#38bdf8" />
      <path d="M16 21 L27 15 L24 26 L20 22 Z" fill="#ffffff" />
      <text x="42" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Agy Laptop Bot</text>

      <!-- Chat Bubble 1 (User) -->
      <rect x="35" y="58" width="150" height="42" rx="10" fill="#0369a1" />
      <text x="45" y="76" font-family="sans-serif" font-size="11" fill="#ffffff">Run unit tests</text>
      <text x="45" y="91" font-family="sans-serif" font-size="11" fill="#bae6fd">and refactor auth</text>

      <!-- Chat Bubble 2 (Bot) -->
      <rect x="15" y="112" width="170" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="25" y="130" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Antigravity Reply:</text>
      <rect x="25" y="138" width="150" height="45" rx="6" fill="#0f172a" />
      <text x="32" y="155" font-family="monospace" font-size="9" fill="#10b981">✓ 12 tests passed</text>
      <text x="32" y="171" font-family="monospace" font-size="9" fill="#94a3b8">📸 screenshot sent</text>
      <text x="25" y="198" font-family="sans-serif" font-size="9" fill="#64748b">100% Battery • Charging</text>
    </g>

    <!-- Flow Connecting Wave / Arrows -->
    <g transform="translate(195, 125)">
      <path d="M 10 30 Q 35 10 60 30" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6,4" />
      <polygon points="65,30 55,24 55,36" fill="#c084fc" />
      <circle cx="35" cy="20" r="5" fill="#38bdf8" />
    </g>

    <!-- Laptop Mockup Card -->
    <g transform="translate(265, 20)">
      <rect x="0" y="0" width="215" height="270" rx="16" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.8" />
      
      <!-- IDE Header -->
      <rect x="0" y="0" width="215" height="34" rx="16" fill="#0f172a" />
      <rect x="0" y="18" width="215" height="16" fill="#0f172a" />
      <circle cx="16" cy="16" r="4" fill="#ef4444" />
      <circle cx="28" cy="16" r="4" fill="#f59e0b" />
      <circle cx="40" cy="16" r="4" fill="#10b981" />
      <text x="56" y="20" font-family="sans-serif" font-size="10" fill="#94a3b8">Antigravity IDE</text>

      <!-- IDE Editor Mockup -->
      <rect x="12" y="44" width="191" height="90" rx="6" fill="#070d19" />
      <text x="20" y="62" font-family="monospace" font-size="9" fill="#c084fc">async def</text>
      <text x="75" y="62" font-family="monospace" font-size="9" fill="#67e8f9">solve_task</text>
      <text x="135" y="62" font-family="monospace" font-size="9" fill="#f8fafc">():</text>
      <text x="32" y="80" font-family="monospace" font-size="9" fill="#94a3b8"># Agent auto-coding...</text>
      <rect x="32" y="92" width="140" height="6" rx="3" fill="#334155" />
      <rect x="32" y="105" width="90" height="6" rx="3" fill="#334155" />
      <rect x="32" y="118" width="120" height="6" rx="3" fill="#10b981" />

      <!-- Agent Chat Canvas Dock -->
      <rect x="12" y="144" width="191" height="110" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="162" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">🤖 Antigravity Agent</text>
      <text x="20" y="180" font-family="sans-serif" font-size="9" fill="#e2e8f0">Received via Telegram:</text>
      <rect x="20" y="188" width="175" height="26" rx="4" fill="#1e293b" />
      <text x="26" y="204" font-family="sans-serif" font-size="9" fill="#38bdf8">&gt; Run unit tests...</text>
      <text x="20" y="234" font-family="monospace" font-size="9" fill="#10b981">● Completed (2.1s)</text>
    </g>
  </g>
</svg>
